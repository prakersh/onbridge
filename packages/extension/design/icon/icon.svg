<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262626"/><stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="8" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="span" x1="0" y1="24" x2="0" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ends" x1="0" y1="50" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f5f5"/><stop offset="1" stop-color="#d4d4d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="url(#rim)"/>
  <g filter="url(#shadow)" transform="translate(0 -6)">
    <path d="M16 100 H112" stroke="url(#span)" stroke-width="6.0" stroke-linecap="round"/>
    <path d="M30 54 Q63 14 97 50" fill="none" stroke="url(#span)" stroke-width="9.0" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M18 60 L36 73 L18 86" fill="none" stroke="url(#ends)" stroke-width="9.0" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 86 H52" stroke="url(#ends)" stroke-width="9.0" stroke-linecap="round"/>
    <rect x="68" y="54" width="44" height="36" rx="7" fill="#171717" stroke="url(#ends)" stroke-width="6.0"/>
    <path d="M68 57 Q68 54 71 54 H109 Q112 54 112 57 V68 H68 Z" fill="url(#ends)"/>
    <circle cx="75" cy="63" r="2.2" fill="#171717"/><circle cx="82" cy="63" r="2.2" fill="#171717"/></g>
</svg>
