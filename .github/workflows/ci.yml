name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: chmod +x app.sh && ./app.sh --build

      # After the build: the handshake suite spawns the built server binary.
      - name: Test
        run: pnpm test

      # The published bundle must be runnable by `npx onbridge`. A duplicated
      # shebang and an unbundled workspace dep both silently broke this before,
      # and neither typecheck nor build caught it.
      - name: Verify server binary starts and registers tools
        run: |
          node - <<'EOF'
          const { spawn } = require('node:child_process');
          const p = spawn('node', ['packages/mcp-server/dist/index.js'], { stdio: ['pipe','pipe','inherit'] });
          let out = '';
          p.stdout.on('data', d => out += d);
          const send = o => p.stdin.write(JSON.stringify(o) + '\n');
          send({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'ci',version:'1'}}});
          setTimeout(() => send({jsonrpc:'2.0',id:2,method:'tools/list',params:{}}), 500);
          setTimeout(() => {
            const msgs = out.trim().split('\n').map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
            const res = msgs.find(m => m.id === 2);
            p.kill();
            if (!res) { console.error('no tools/list response'); process.exit(1); }
            if (res.error) { console.error('tools/list failed:', res.error.message); process.exit(1); }
            console.log(`OK: ${res.result.tools.length} tools registered`);
            process.exit(res.result.tools.length > 0 ? 0 : 1);
          }, 2000);
          EOF

      - name: Verify build artifacts
        run: |
          echo "── MCP Server ──"
          ls -lh packages/mcp-server/dist/
          echo "── Shared ──"
          ls -lh packages/shared/dist/
          echo "── Extension ──"
          ls -lh packages/extension/.output/chrome-mv3/ || echo "Extension output not found (expected in WXT build)"
