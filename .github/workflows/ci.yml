name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs this same job first, so nothing is tagged or published unless every suite passes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, Build & All Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: chmod +x app.sh && ./app.sh --build

      # After the build: the handshake suite spawns the built server binary.
      - name: Test
        run: pnpm test

      # The published bundle must be runnable by `npx @onllm-dev/onbridge-mcp`.
      # A duplicated shebang and an unbundled workspace dep both silently broke
      # this before, and neither typecheck nor build caught it.
      - name: Verify server binary starts and registers tools
        run: |
          node - <<'EOF'
          const { spawn } = require('node:child_process');
          const p = spawn('node', ['packages/mcp-server/dist/index.js'], { stdio: ['pipe','pipe','inherit'] });
          let out = '';
          p.stdout.on('data', d => out += d);
          const send = o => p.stdin.write(JSON.stringify(o) + '\n');
          send({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'ci',version:'1'}}});
          setTimeout(() => send({jsonrpc:'2.0',id:2,method:'tools/list',params:{}}), 500);
          setTimeout(() => {
            const msgs = out.trim().split('\n').map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
            const res = msgs.find(m => m.id === 2);
            p.kill();
            if (!res) { console.error('no tools/list response'); process.exit(1); }
            if (res.error) { console.error('tools/list failed:', res.error.message); process.exit(1); }
            console.log(`OK: ${res.result.tools.length} tools registered`);
            process.exit(res.result.tools.length > 0 ? 0 : 1);
          }, 2000);
          EOF

      # The browser suites load the built extension into Playwright's Chromium and pair it with the built server, on the test ports. verify-browser.mjs runs a headed browser, hence the virtual display.
      - name: Install Chromium for the browser suites
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Browser suites (verify-browser, verify-multi-browser)
        run: xvfb-run -a pnpm test:browser

      # What a release ships, built and run the way a user gets it, so a PR proves everything a release does except tagging and publishing: the GitHub Release server tarball (installed from the tarball, not the workspace), the npm tarball (the exact bytes npm would fetch), and the Web Store zip.
      - name: Package as a release would, and run what it ships
        run: |
          set -euo pipefail
          ./app.sh --package
          v="$(tr -d '[:space:]' < VERSION)"
          work="$(mktemp -d)"
          tar -xzf "artifacts/onbridge-mcp-server-v$v.tar.gz" -C "$work"
          (cd "$work/onbridge-mcp-server-v$v" && npm install --omit=dev --silent)
          tarball="$(cd packages/mcp-server && npm pack --pack-destination "$work" --silent)"
          mkdir "$work/npm" && (cd "$work/npm" && npm init -y > /dev/null && npm install --silent "../$tarball")
          npm_entry="$(cd "$work/npm" && node -p "require.resolve('@onllm-dev/onbridge-mcp')")"
          for entry in "$work/onbridge-mcp-server-v$v/dist/index.js" "$npm_entry"; do
            node - "$entry" "$v" <<'EOF'
          const { spawn } = require('node:child_process');
          const [entry, version] = process.argv.slice(2);
          const p = spawn('node', [entry], { stdio: ['pipe', 'pipe', 'inherit'] });
          let out = '';
          p.stdout.on('data', d => out += d);
          const send = o => p.stdin.write(JSON.stringify(o) + '\n');
          send({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'ci',version:'1'}}});
          setTimeout(() => send({jsonrpc:'2.0',id:2,method:'tools/list',params:{}}), 500);
          setTimeout(() => {
            const msgs = out.trim().split('\n').map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
            const init = msgs.find(m => m.id === 1), list = msgs.find(m => m.id === 2);
            p.kill();
            if (init?.result?.serverInfo?.version !== version) { console.error(`${entry}: reports ${init?.result?.serverInfo?.version}, expected ${version}`); process.exit(1); }
            if (!list?.result?.tools?.length) { console.error(`${entry}: registered no tools`); process.exit(1); }
            console.log(`OK: ${entry} runs v${version}, ${list.result.tools.length} tools`);
          }, 2500);
          EOF
          done
          # The store rejects a manifest carrying `key`, and the zip must be the version being released.
          unzip -p "artifacts/onbridge-extension-v$v.zip" manifest.json | node -e '
            const m = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (m.key) { console.error("extension zip still carries the manifest key"); process.exit(1); }
            if (m.version !== process.argv[1]) { console.error(`extension zip is ${m.version}, expected ${process.argv[1]}`); process.exit(1); }
            console.log(`OK: extension zip v${m.version}, no key`);' "$v"

      - name: Verify build artifacts
        run: |
          echo "── MCP Server ──"
          ls -lh packages/mcp-server/dist/
          echo "── Shared ──"
          ls -lh packages/shared/dist/
          echo "── Extension ──"
          ls -lh packages/extension/.output/chrome-mv3/ || echo "Extension output not found (expected in WXT build)"
