name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION file ($VERSION) does not match tag (v$TAG_VERSION)"
            exit 1
          fi
          echo "✓ Version: $VERSION"

      - name: Build & Package
        run: |
          chmod +x app.sh
          ./app.sh --package

      # Exercises exactly what install.sh does to the published tarball. A
      # `workspace:*` entry left in the shipped manifest made `npm install` fail
      # with EUNSUPPORTEDPROTOCOL, which no other check caught because the
      # in-repo build and the npx path both work fine.
      - name: Verify the packaged server installs and runs
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf "artifacts/onbridge-mcp-server-v${{ steps.version.outputs.version }}.tar.gz" -C "$work"
          cd "$work/onbridge-mcp-server-v${{ steps.version.outputs.version }}"
          npm install --omit=dev
          node - <<'EOF'
          const { spawn } = require('node:child_process');
          const p = spawn('node', ['dist/index.js'], { stdio: ['pipe', 'pipe', 'inherit'] });
          let out = '';
          p.stdout.on('data', d => out += d);
          const send = o => p.stdin.write(JSON.stringify(o) + '\n');
          send({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'ci',version:'1'}}});
          setTimeout(() => send({jsonrpc:'2.0',id:2,method:'tools/list',params:{}}), 500);
          setTimeout(() => {
            const msgs = out.trim().split('\n').map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
            const list = msgs.find(m => m.id === 2);
            p.kill();
            if (!list?.result?.tools?.length) { console.error('packaged server did not register tools'); process.exit(1); }
            console.log(`OK: packaged server runs, ${list.result.tools.length} tools`);
          }, 2500);
          EOF

      - name: Upload MCP Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: onbridge-mcp-server-v${{ steps.version.outputs.version }}
          path: artifacts/onbridge-mcp-server-v${{ steps.version.outputs.version }}.tar.gz
          retention-days: 90

      - name: Upload Extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: onbridge-extension-v${{ steps.version.outputs.version }}
          path: artifacts/onbridge-extension-v${{ steps.version.outputs.version }}.zip
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OnBridge v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/onbridge-mcp-server-v${{ steps.version.outputs.version }}.tar.gz
            artifacts/onbridge-extension-v${{ steps.version.outputs.version }}.zip
          body: |
            ## OnBridge v${{ steps.version.outputs.version }}

            ### Artifacts

            | Artifact | Description |
            |---|---|
            | `onbridge-mcp-server-v${{ steps.version.outputs.version }}.tar.gz` | MCP server — install via `npx onbridge` or extract and run |
            | `onbridge-extension-v${{ steps.version.outputs.version }}.zip` | Chrome extension (MV3) — load unpacked in `chrome://extensions/` |

            ### Quick Start

            ```bash
            # MCP Server (after npm publish)
            npx onbridge

            # Or download and run directly
            tar -xzf onbridge-mcp-server-v${{ steps.version.outputs.version }}.tar.gz
            node onbridge-mcp-server-v${{ steps.version.outputs.version }}/dist/index.js
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
