name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ─── Extract version from tag ──────────────────────────────────
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (tag: $TAG)"

  # ─── Publish the MCP server to npm ─────────────────────────────
  # Setup: npmjs.com → the `@onllm-dev/onbridge-mcp` package → Settings →
  # Trusted Publisher → GitHub Actions, with repo=prakersh/onbridge and
  # workflow=release.yml.
  # No NPM_TOKEN: CI authenticates via GitHub OIDC, so there is no long-lived
  # credential to leak and nothing that expires to break a future release.
  #
  # Not a dependency of `release` below, so an npm failure never blocks the
  # GitHub Release and its artifacts, which are the path most users install from.
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: meta
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # npm >= 11.5.1 is required for OIDC trusted publishing. Installing into
      # a user prefix avoids the known self-upgrade bug where the existing
      # system npm breaks mid-update (MODULE_NOT_FOUND for promise-retry).
      - name: Upgrade npm to a version supporting trusted publishing
        run: |
          NPM_PREFIX="$HOME/.npm-global"
          mkdir -p "$NPM_PREFIX"
          npm install -g --prefix "$NPM_PREFIX" npm@11.12.1
          echo "$NPM_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `VERSION` and the manifest npm will actually read must agree. ./app.sh
      # --build syncs them, so a mismatch means one was edited by hand.
      - name: Verify version matches tag
        run: |
          set -euo pipefail
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          PKG_VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          for pair in "VERSION:$FILE_VERSION" "packages/mcp-server/package.json:$PKG_VERSION"; do
            IFS=: read -r what a <<< "$pair"
            if [ "$a" != "${{ needs.meta.outputs.version }}" ]; then
              echo "::error::$what is $a but the tag is ${{ needs.meta.outputs.version }}"
              exit 1
            fi
          done
          echo "✓ v${{ needs.meta.outputs.version }}"

      - name: Build the MCP server
        run: |
          chmod +x app.sh
          ./app.sh --build

      # Publishes the exact bytes `npm install` would fetch, then runs them.
      # The in-repo build is not the same artifact: `files` and the workspace
      # devDependency are only resolved at pack time.
      - name: Verify the packed tarball installs and runs
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tarball="$(cd packages/mcp-server && npm pack --pack-destination "$work" --silent)"
          cd "$work" && npm init -y > /dev/null && npm install --silent "./$tarball"
          # Resolved from the installed package rather than a hardcoded path, so
          # a rename to a different scope cannot leave this pointing at a
          # directory that no longer exists.
          entry="$(node -p "require.resolve('@onllm-dev/onbridge-mcp')")"
          node - "$entry" <<'EOF'
          const { spawn } = require('node:child_process');
          const p = spawn('node', [process.argv[2]], { stdio: ['pipe', 'pipe', 'inherit'] });
          let out = '';
          p.stdout.on('data', d => out += d);
          const send = o => p.stdin.write(JSON.stringify(o) + '\n');
          send({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'ci',version:'1'}}});
          setTimeout(() => send({jsonrpc:'2.0',id:2,method:'tools/list',params:{}}), 500);
          setTimeout(() => {
            const msgs = out.trim().split('\n').map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
            const list = msgs.find(m => m.id === 2);
            p.kill();
            if (!list?.result?.tools?.length) { console.error('packed server did not register tools'); process.exit(1); }
            console.log(`OK: packed server runs, ${list.result.tools.length} tools`);
          }, 2500);
          EOF

      - name: Publish to npm (trusted publishing + provenance)
        working-directory: packages/mcp-server
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          # Re-running a tag (a failed job retried, a re-tag) must not be a hard
          # error: npm rejects a version that already exists, and the artifact
          # already published is the one this commit produced.
          if npm view "@onllm-dev/onbridge-mcp@$VERSION" version > /dev/null 2>&1; then
            echo "@onllm-dev/onbridge-mcp@$VERSION is already on npm — skipping publish."
            exit 0
          fi
          npm publish --access public --provenance

  # ─── Build artifacts and create the GitHub Release ─────────────
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: meta
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ "$VERSION" != "${{ needs.meta.outputs.version }}" ]; then
            echo "::error::VERSION file ($VERSION) does not match tag (v${{ needs.meta.outputs.version }})"
            exit 1
          fi
          echo "✓ Version: $VERSION"

      - name: Build & Package
        run: |
          chmod +x app.sh
          ./app.sh --package

      # Installs the published tarball the way someone installing from a Release would. A
      # `workspace:*` entry left in the shipped manifest made `npm install` fail
      # with EUNSUPPORTEDPROTOCOL, which no other check caught because the
      # in-repo build and the npx path both work fine.
      - name: Verify the packaged server installs and runs
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf "artifacts/onbridge-mcp-server-v${{ needs.meta.outputs.version }}.tar.gz" -C "$work"
          cd "$work/onbridge-mcp-server-v${{ needs.meta.outputs.version }}"
          npm install --omit=dev
          node - <<'EOF'
          const { spawn } = require('node:child_process');
          const p = spawn('node', ['dist/index.js'], { stdio: ['pipe', 'pipe', 'inherit'] });
          let out = '';
          p.stdout.on('data', d => out += d);
          const send = o => p.stdin.write(JSON.stringify(o) + '\n');
          send({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'ci',version:'1'}}});
          setTimeout(() => send({jsonrpc:'2.0',id:2,method:'tools/list',params:{}}), 500);
          setTimeout(() => {
            const msgs = out.trim().split('\n').map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
            const list = msgs.find(m => m.id === 2);
            p.kill();
            if (!list?.result?.tools?.length) { console.error('packaged server did not register tools'); process.exit(1); }
            console.log(`OK: packaged server runs, ${list.result.tools.length} tools`);
          }, 2500);
          EOF

      - name: Upload MCP Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: onbridge-mcp-server-v${{ needs.meta.outputs.version }}
          path: artifacts/onbridge-mcp-server-v${{ needs.meta.outputs.version }}.tar.gz
          retention-days: 90

      - name: Upload Extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: onbridge-extension-v${{ needs.meta.outputs.version }}
          path: artifacts/onbridge-extension-v${{ needs.meta.outputs.version }}.zip
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: OnBridge v${{ needs.meta.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/onbridge-mcp-server-v${{ needs.meta.outputs.version }}.tar.gz
            artifacts/onbridge-extension-v${{ needs.meta.outputs.version }}.zip
          body: |
            ## OnBridge v${{ needs.meta.outputs.version }}

            ### Install

            **MCP server** — add to your agent's MCP config:

            ```json
            {
              "mcpServers": {
                "onbridge": {
                  "command": "npx",
                  "args": ["-y", "@onllm-dev/onbridge-mcp"],
                  "type": "stdio"
                }
              }
            }
            ```

            **Chrome extension** — install from the [Chrome Web Store](https://chromewebstore.google.com/detail/onbridge/minhhfibhfnjdcgiipmcbfgclmeineca).
            Or download `onbridge-extension-v${{ needs.meta.outputs.version }}.zip` below, unzip it, and load it unpacked at `chrome://extensions/` with Developer mode enabled.

            ### Artifacts

            | Artifact | Description |
            |---|---|
            | `onbridge-mcp-server-v${{ needs.meta.outputs.version }}.tar.gz` | MCP server — same build the npm package ships |
            | `onbridge-extension-v${{ needs.meta.outputs.version }}.zip` | Chrome extension (MV3), Web Store ready |

            ### Run without npm

            ```bash
            tar -xzf onbridge-mcp-server-v${{ needs.meta.outputs.version }}.tar.gz
            cd onbridge-mcp-server-v${{ needs.meta.outputs.version }} && npm install --omit=dev
            node dist/index.js
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
